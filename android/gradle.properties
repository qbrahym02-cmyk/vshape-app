# ---- Gradle / AGP settings -------------------------------------------------
# These are the *normal* values (CI and any dev machine with >= 4 GB RAM).
#
# Building on a very small machine (1-2 GB RAM)? Copy this block into
# android/gradle.properties instead:
#
#   org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC -Dfile.encoding=UTF-8
#   org.gradle.parallel=false
#   org.gradle.caching=false
#   org.gradle.workers.max=1
#   kotlin.compiler.execution.strategy=in-process
#   kotlin.daemon.useFallbackStrategy=true
#
# ...or better, just let GitHub Actions build it (see BUILD.md).
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.vfs.watch=true

kotlin.incremental=true

android.useAndroidX=true
# Flags added by the Flutter template (keep them).
android.newDsl=false
android.builtInKotlin=false
